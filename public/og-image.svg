<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#2563eb" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow circles -->
  <circle cx="950" cy="180" r="280" fill="url(#glow)"/>
  <circle cx="180" cy="500" r="240" fill="url(#glow)"/>

  <!-- Eyebrow -->
  <text x="600" y="180" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700"
        letter-spacing="6" fill="url(#accent)">
    MINDEN NAP AI
  </text>

  <!-- Hero title -->
  <text x="600" y="290" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="88" font-weight="900"
        letter-spacing="-2" fill="#ffffff" filter="url(#text-glow)">
    Az AI érthetően.
  </text>

  <!-- Subtitle -->
  <text x="600" y="370" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="500"
        letter-spacing="-0.5" fill="#9ca3af">
    Hírek és tudás minden nap.
  </text>

  <!-- Tag pills -->
  <g transform="translate(600, 460)">
    <g transform="translate(-300, 0)">
      <rect x="-90" y="-22" width="180" height="44" rx="22" fill="rgba(37,99,235,0.12)" stroke="rgba(37,99,235,0.35)" stroke-width="1"/>
      <text x="0" y="6" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#60a5fa">AI Hírek</text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="-90" y="-22" width="180" height="44" rx="22" fill="rgba(124,58,237,0.12)" stroke="rgba(124,58,237,0.35)" stroke-width="1"/>
      <text x="0" y="6" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#a78bfa">Kurzusok</text>
    </g>
    <g transform="translate(300, 0)">
      <rect x="-90" y="-22" width="180" height="44" rx="22" fill="rgba(34,211,238,0.12)" stroke="rgba(34,211,238,0.35)" stroke-width="1"/>
      <text x="0" y="6" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#22d3ee">Tudástár</text>
    </g>
  </g>

  <!-- URL -->
  <text x="600" y="580" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="500"
        letter-spacing="2" fill="#64748b">
    mindennapai.eu
  </text>

  <!-- Bottom gradient bar -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#bar)"/>
</svg>
